[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figlib"
dynamic = ["version"]
description = "Figure tooling for slides and papers: layout linters, an HTML-to-SVG exporter, a CVD-checked palette, and .pptx assembly."
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "figlib/fonts/OFL.txt"]
requires-python = ">=3.10"
# Core = figcheck, palette, fonts, inputs. Everything else is behind an extra so a
# matplotlib-only user does not pull in Chromium or python-pptx.
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
html = ["playwright>=1.40"]                        # check_layout, export_svg (then: playwright install chromium)
deck = ["python-pptx>=1.0", "cairosvg>=2.7", "pypdfium2>=4.30",
        "pywin32>=306; sys_platform == 'win32'"]   # deck, outline, render (+ PowerPoint or LibreOffice for render)
video = ["imageio-ffmpeg>=0.5"]                    # anim, scene, clip
structure = ["gemmi>=0.6", "scipy>=1.10"]          # silhouette
all = ["figlib[html,deck,video,structure]"]
test = ["figlib[all]", "pytest>=7"]

[tool.setuptools.packages.find]
include = ["figlib*"]

[tool.setuptools.package-data]
figlib = ["fonts/*.ttf", "fonts/OFL.txt", "tests/*.py",
          "starter/*.md", "starter/figs/*.py", "starter/figs/*.html", "starter/figs/*.svg"]   # tests/ has no __init__.py

[tool.setuptools.dynamic]
version = {attr = "figlib.__version__"}   # one source of truth
