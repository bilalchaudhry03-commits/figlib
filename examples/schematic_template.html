<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Schematic template</title>
<!--
Starter for an HTML+SVG slide schematic. Copy it, then:
    python -m figlib.check_layout my_figure.html                 # fix everything it reports
    python -m figlib.export_svg my_figure.html my_figure.svg --group

What it already does right (keep these when you edit):
  = 16:9 viewBox (1600 x 900), so 1 unit = 0.6 pt on a widescreen slide: 28 px body = 16.8 pt.
  = Font stack Calibri, Arial, Helvetica, sans-serif (figlib.fonts.STACK). The figlib tools
    measure it in Carlito, which has Calibri's exact widths.
  = Colours come from CSS variables set as presentation attributes or class rules, one way per
    property (a class rule silently beats an attribute).
  = Geometry that depends on text width is computed by the script below, after the font exists.
  = Every label is ink. No grey sub-line under a label: if it is worth saying, it is a label;
    otherwise it goes in the speaker notes. Grey (--ink-2, --ink-3) is for strokes and context shapes.
Colour tokens: python -c "from figlib import palette; print(palette.as_css_vars(names=[]))"
-->
<style>
  :root {
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a8985; --surface: #fcfcfb;
    --chain-a-fill: #009E73; --chain-a-stroke: #00543D;
    --chain-b-fill: #CC79A7; --chain-b-stroke: #7A3F60;
    --chain-c-fill: #E69F00; --chain-c-stroke: #8A5E00;
    --font: Calibri, Arial, Helvetica, sans-serif;
  }
  html, body { margin: 0; background: #ffffff; }
  svg { width: 100%; max-width: 1600px; height: auto; display: block; }
  text { font-family: var(--font); fill: var(--ink); }
  .label { font-size: 34px; font-weight: 700; }
  .flow  { stroke: var(--ink-2); stroke-width: 3; fill: none; }
</style>
</head>
<body>
<svg id="fig" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <g id="steps"></g>
</svg>

<script>
(function () {
  // ==== content: one entry per step, left to right ====
  const STEPS = [
    {label: "Sample",  fill: "var(--chain-a-fill)", stroke: "var(--chain-a-stroke)"},
    {label: "Measure", fill: "var(--chain-b-fill)", stroke: "var(--chain-b-stroke)"},
    {label: "Model",   fill: "var(--chain-c-fill)", stroke: "var(--chain-c-stroke)"},
  ];
  // ==== layout grid (viewBox units) ====
  const W = 1600, CY = 400, PAD_X = 36, BOX_H = 120, GAP = 150, MIN_W = 240;

  const NS = "http://www.w3.org/2000/svg", root = document.getElementById("steps");
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    root.appendChild(e);
    return e;
  };

  // Size each box to its label, then centre the whole row on the canvas.
  const labels = STEPS.map(s => el("text", {class: "label", "text-anchor": "middle", y: CY + 12}, s.label));
  const widths = labels.map(t => Math.max(MIN_W, t.getBBox().width + 2 * PAD_X));
  let x = (W - widths.reduce((a, b) => a + b, 0) - GAP * (STEPS.length - 1)) / 2;
  STEPS.forEach((s, i) => {
    const w = widths[i];
    const box = el("rect", {x, y: CY - BOX_H / 2, width: w, height: BOX_H, fill: s.fill,
                            stroke: s.stroke, "stroke-width": 3, "fill-opacity": 0.25});
    root.insertBefore(box, labels[i]);                    // box under its label
    labels[i].setAttribute("x", x + w / 2);
    if (i < STEPS.length - 1)
      el("line", {class: "flow", x1: x + w + 14, y1: CY, x2: x + w + GAP - 14, y2: CY,
                  "marker-end": "url(#arrow)"});
    x += w + GAP;
  });
})();
</script>
</body>
</html>
