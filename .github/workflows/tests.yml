name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moved to 26 in Oct 2026; upgrade on purpose
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test]" pyflakes
      - name: Install Chromium for the HTML tools
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: python -m pyflakes figlib
      - name: Test
        run: python -m pytest -q figlib/tests
